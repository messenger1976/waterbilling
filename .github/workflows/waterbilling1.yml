on:
  push:
    branches:
      - waterbilling1
name: 🚀 Deploy waterbilling1 system on push
jobs:
  web-deploy:
    name: 🎉 Deploy water billing1 Server
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v2
    
    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: waterbilling1.uk.tempcloudsite.com
        username: ${{ secrets.ftp_username1 }}
        password: ${{ secrets.ftp_password1 }}
        server-dir: /
        exclude: |
          **/.git*
          **/.git*/**
          **/application/cache/**
          **/application/config/database.php
          **/.buildpath/**
          .ftp-deploy-sync-state.json
          .git-ftp.log
          .project
          .htaccess
          error_log
